name: fundflow
description: A new Flutter project.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.19.3 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  go_router: ^10.0.0
  action_slider: ^0.7.0
  custom_pop_up_menu: ^1.2.4
  flutter_bloc: ^8.1.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  top_snackbar_flutter: ^3.1.0
  flutter_spinkit: ^5.2.0
  awesome_dialog: ^3.1.0
  dropdown_search: ^5.0.6
  flutter_slidable: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  lottie: ^2.3.2
  currency_picker: ^2.0.19
  flutter_svg: ^2.0.5
  flutter_staggered_animations: ^1.1.1
  shared_preferences: ^2.5.3
  font_awesome_flutter: ^10.12.0
  fl_chart: ^1.1.1
  local_auth: ^3.0.0
  pdf: ^3.11.3
  csv: ^6.0.0
  path_provider: ^2.1.5
  open_file: ^3.5.10
  animations: ^2.1.1
  intl: ^0.20.2
  concentric_transition: ^1.0.3
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.3.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color: "#8A0076B5"
  image_path: "assets/images/app-icon.png"

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/translations/
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel/Cinzel-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cinzel/Cinzel-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cinzel/Cinzel-SemiBold.ttf
          weight: 600
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand/Quicksand-Light.ttf
          weight: 300
        - asset: assets/fonts/Quicksand/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/fonts/Quicksand/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand/Quicksand-SemiBold.ttf
          weight: 600
